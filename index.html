<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Period Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              800: '#27272a',
              900: '#18181b',
              950: '#0f0f11',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-brand-950 dark:text-zinc-100 min-h-screen transition-colors duration-200">
  
  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-20">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-zinc-200 dark:border-zinc-800">
      <div>
        <h1 class="text-xl font-light tracking-widest uppercase text-rose-500 dark:text-rose-400">Cycle</h1>
        <p id="stats-summary" class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">No periods logged yet</p>
      </div>
      <div class="flex items-center gap-3">
        <!-- View Toggle -->
        <button id="view-toggle" class="text-xs font-mono uppercase tracking-wider px-2.5 py-1 rounded border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800">Year</button>
        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" class="p-1.5 rounded-full border border-zinc-300 dark:border-zinc-700">
          <svg id="moon-icon" class="w-4 h-4 hidden dark:block text-rose-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <svg id="sun-icon" class="w-4 h-4 block dark:hidden text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <!-- Settings -->
        <button id="open-settings" class="p-1.5 rounded-full border border-zinc-300 dark:border-zinc-700">
          <svg class="w-4 h-4 text-zinc-600 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Content Views -->
    <main class="flex-1 my-6">
      <!-- Month View -->
      <div id="month-view" class="space-y-4">
        <div class="flex justify-between items-center mb-2">
          <button id="prev-month" class="p-2 text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100">&larr;</button>
          <h2 id="current-month-label" class="font-medium text-lg tracking-wide"></h2>
          <button id="next-month" class="p-2 text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100">&rarr;</button>
        </div>

        <div class="grid grid-cols-7 text-center text-xs text-zinc-400 font-mono mb-1">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>

        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>
        
        <p class="text-center text-xs text-zinc-400 mt-6 font-mono">
          Tap date to toggle period &bull; Hold for notes
        </p>
      </div>

      <!-- Year View (Hidden by default) -->
      <div id="year-view" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <button id="prev-year" class="p-2 text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100">&larr;</button>
          <h2 id="current-year-label" class="font-medium text-lg tracking-wide">2026</h2>
          <button id="next-year" class="p-2 text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100">&rarr;</button>
        </div>
        <div id="year-grid" class="grid grid-cols-3 gap-3"></div>
      </div>
    </main>

    <!-- Bottom Drawer Note Editor (Hidden by default) -->
    <div id="note-drawer" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end">
      <div class="w-full max-w-md mx-auto bg-white dark:bg-zinc-900 rounded-t-2xl p-5 space-y-4 shadow-xl border-t border-zinc-200 dark:border-zinc-800">
        <div class="flex justify-between items-center">
          <h3 id="drawer-date-label" class="font-medium text-sm tracking-wide"></h3>
          <button id="close-drawer" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 text-xl">&times;</button>
        </div>

        <div class="flex gap-2">
          <button id="toggle-period-btn" class="flex-1 py-2.5 rounded-lg text-xs font-mono uppercase tracking-wider transition-colors">
            Mark Period Start
          </button>
        </div>

        <textarea id="drawer-note-input" rows="3" placeholder="Add optional notes, symptoms, mood..." class="w-full p-3 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-sm focus:outline-none resize-none border border-transparent focus:border-rose-400 dark:focus:border-rose-500"></textarea>

        <button id="save-drawer" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-mono uppercase tracking-wider rounded-lg shadow-sm">
          Save Entry
        </button>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl p-6 space-y-5 border border-zinc-200 dark:border-zinc-800">
        <div class="flex justify-between items-center">
          <h3 class="font-medium">Data & Storage</h3>
          <button id="close-settings" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 text-xl">&times;</button>
        </div>

        <div class="space-y-3">
          <label class="block text-xs uppercase tracking-wider font-mono text-zinc-500">Import Flo or Backup JSON</label>
          <input type="file" id="import-file" accept=".json" class="block w-full text-xs text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-mono file:bg-zinc-100 dark:file:bg-zinc-800 file:text-zinc-700 dark:file:text-zinc-300 hover:file:bg-zinc-200" />
        </div>

        <div class="space-y-2 pt-2 border-t border-zinc-200 dark:border-zinc-800">
          <button id="export-btn" class="w-full py-2.5 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-lg text-xs font-mono uppercase tracking-wider">
            Export JSON Backup
          </button>
          <button id="clear-btn" class="w-full py-2.5 border border-rose-500/30 text-rose-500 hover:bg-rose-500/10 rounded-lg text-xs font-mono uppercase tracking-wider">
            Clear All Local Data
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Local Storage Wrapper
    const Storage = {
      KEY: 'minimalist_period_tracker_db',
      data: { periods: {}, notes: {} },
      
      init() {
        const raw = localStorage.getItem(this.KEY);
        if (raw) {
          try { this.data = JSON.parse(raw); } catch(e){ this.data = { periods: {}, notes: {} }; }
        }
        if (!this.data.periods) this.data.periods = {};
        if (!this.data.notes) this.data.notes = {};
      },
      save() {
        localStorage.setItem(this.KEY, JSON.stringify(this.data));
      },
      togglePeriod(dateStr) {
        if (this.data.periods[dateStr]) {
          delete this.data.periods[dateStr];
        } else {
          this.data.periods[dateStr] = true;
        }
        this.save();
      },
      setNote(dateStr, note) {
        if (!note || !note.trim()) {
          delete this.data.notes[dateStr];
        } else {
          this.data.notes[dateStr] = note.trim();
        }
        this.save();
      },
      exportJSON() {
        const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cycle-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      },
      importFlo(jsonObj) {
        let count = 0;
        const findDates = (obj) => {
          if (!obj) return;
          if (typeof obj === 'string' && /^\d{4}-\d{2}-\d{2}/.test(obj)) {
            const d = obj.split('T')[0];
            this.data.periods[d] = true;
            count++;
          } else if (Array.isArray(obj)) {
            obj.forEach(findDates);
          } else if (typeof obj === 'object') {
            for (let k in obj) {
              if (['date', 'startDate', 'start_date', 'logged_at', 'cycle_start'].includes(k) && typeof obj[k] === 'string') {
                const d = obj[k].split('T')[0];
                this.data.periods[d] = true;
                count++;
              } else {
                findDates(obj[k]);
              }
            }
          }
        };
        findDates(jsonObj);
        this.save();
        return count;
      }
    };

    Storage.init();

    // App State
    let currentDate = new Date();
    let selectedDateStr = null;
    let longPressTimer = null;
    let currentView = 'month';

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // UI Elements
    const calendarGrid = document.getElementById('calendar-grid');
    const monthLabel = document.getElementById('current-month-label');
    const statsSummary = document.getElementById('stats-summary');
    const drawer = document.getElementById('note-drawer');
    const settingsModal = document.getElementById('settings-modal');

    function formatDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function updateStats() {
      try {
        const dates = Object.keys(Storage.data.periods || {}).sort().reverse();
        if (dates.length === 0) {
          statsSummary.innerText = "No periods logged yet";
          return;
        }
        const last = new Date(dates[0] + 'T00:00:00');
        const today = new Date();
        today.setHours(0,0,0,0);
        const diffTime = today - last;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) {
          statsSummary.innerText = "Period started today";
        } else if (diffDays > 0) {
          statsSummary.innerText = `${diffDays} day${diffDays > 1 ? 's' : ''} since last period`;
        } else {
          statsSummary.innerText = "Logged date is in the future";
        }
      } catch (err) {
        statsSummary.innerText = "No periods logged yet";
      }
    }

    function renderMonth() {
      if (!calendarGrid) return;
      calendarGrid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      if (monthLabel) {
        monthLabel.innerText = `${monthNames[month]} ${year}`;
      }

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        calendarGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dateStr = formatDateStr(dateObj);
        const isPeriod = Storage.data.periods && Storage.data.periods[dateStr];
        const hasNote = Storage.data.notes && Storage.data.notes[dateStr];
        const isFuture = dateObj > today;

        const cell = document.createElement('button');
        
        if (isFuture) {
          cell.className = `aspect-square rounded-xl flex flex-col items-center justify-center relative text-sm font-medium bg-zinc-100/30 dark:bg-zinc-900/20 text-zinc-300 dark:text-zinc-700 cursor-not-allowed`;
        } else {
          cell.className = `aspect-square rounded-xl flex flex-col items-center justify-center relative text-sm font-medium transition-all ${
            isPeriod 
              ? 'bg-rose-500 text-white dark:bg-rose-500/95 shadow-sm font-semibold' 
              : 'bg-zinc-100/80 dark:bg-zinc-900/60 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-800'
          }`;
        }

        cell.innerHTML = `
          <span>${day}</span>
          ${hasNote && !isFuture ? `<span class="w-1.5 h-1.5 rounded-full ${isPeriod ? 'bg-amber-300' : 'bg-rose-400'} absolute bottom-1.5"></span>` : ''}
        `;

        if (isFuture) {
          cell.addEventListener('click', () => {
            alert("You cannot log periods or notes for future dates.");
          });
        } else {
          cell.addEventListener('touchstart', () => {
            longPressTimer = setTimeout(() => openDrawer(dateStr), 500);
          });
          cell.addEventListener('touchend', () => clearTimeout(longPressTimer));

          cell.addEventListener('click', () => {
            if (longPressTimer) clearTimeout(longPressTimer);
            Storage.togglePeriod(dateStr);
            renderMonth();
          });

          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            openDrawer(dateStr);
          });
        }

        calendarGrid.appendChild(cell);
      }
      updateStats();
    }

    function openDrawer(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('drawer-date-label').innerText = dateStr;
      document.getElementById('drawer-note-input').value = (Storage.data.notes && Storage.data.notes[dateStr]) || '';
      
      const toggleBtn = document.getElementById('toggle-period-btn');
      if (Storage.data.periods && Storage.data.periods[dateStr]) {
        toggleBtn.innerText = "Remove Period Mark";
        toggleBtn.className = "flex-1 py-2.5 rounded-lg text-xs font-mono uppercase tracking-wider border border-rose-500/40 text-rose-500 hover:bg-rose-500/10";
      } else {
        toggleBtn.innerText = "Mark Period Start";
        toggleBtn.className = "flex-1 py-2.5 rounded-lg text-xs font-mono uppercase tracking-wider bg-rose-500/10 text-rose-500 hover:bg-rose-500/20";
      }

      drawer.classList.remove('hidden');
    }

    // Month Navigation
    document.getElementById('prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderMonth();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderMonth();
    });

    // Year Navigation
    document.getElementById('prev-year').addEventListener('click', () => {
      currentDate.setFullYear(currentDate.getFullYear() - 1);
      renderYear();
    });
    document.getElementById('next-year').addEventListener('click', () => {
      currentDate.setFullYear(currentDate.getFullYear() + 1);
      renderYear();
    });

    // Drawer Listeners
    document.getElementById('close-drawer').addEventListener('click', () => drawer.classList.add('hidden'));
    document.getElementById('save-drawer').addEventListener('click', () => {
      const note = document.getElementById('drawer-note-input').value;
      Storage.setNote(selectedDateStr, note);
      drawer.classList.add('hidden');
      renderMonth();
    });
    document.getElementById('toggle-period-btn').addEventListener('click', () => {
      Storage.togglePeriod(selectedDateStr);
      drawer.classList.add('hidden');
      renderMonth();
    });

    // Theme Toggle
    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Settings Modal
    document.getElementById('open-settings').addEventListener('click', () => settingsModal.classList.remove('hidden'));
    document.getElementById('close-settings').addEventListener('click', () => settingsModal.classList.add('hidden'));
    document.getElementById('export-btn').addEventListener('click', () => Storage.exportJSON());

    // ALL CAPS Confirmation for Clear Data
    document.getElementById('clear-btn').addEventListener('click', () => {
      const confirmation = prompt("To permanently erase all period logs and notes, type DELETE in all caps:");
      if (confirmation === 'DELETE') {
        Storage.data = { periods: {}, notes: {} };
        Storage.save();
        renderMonth();
        settingsModal.classList.add('hidden');
        alert("All local data has been cleared.");
      } else if (confirmation !== null) {
        alert("Confirmation text did not match 'DELETE'. Action canceled.");
      }
    });

    // Flo & Backup Importer
    document.getElementById('import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const json = JSON.parse(evt.target.result);
          const importedCount = Storage.importFlo(json);
          alert(`Successfully imported ${importedCount} cycle records!`);
          settingsModal.classList.add('hidden');
          renderMonth();
        } catch(err) {
          alert('Could not parse JSON file.');
        }
      };
      reader.readAsText(file);
    });

    // View Switcher
    document.getElementById('view-toggle').addEventListener('click', () => {
      const yearView = document.getElementById('year-view');
      const monthView = document.getElementById('month-view');
      if (currentView === 'month') {
        currentView = 'year';
        monthView.classList.add('hidden');
        yearView.classList.remove('hidden');
        document.getElementById('view-toggle').innerText = 'Month';
        renderYear();
      } else {
        currentView = 'month';
        yearView.classList.add('hidden');
        monthView.classList.remove('hidden');
        document.getElementById('view-toggle').innerText = 'Year';
        renderMonth();
      }
    });

    function renderYear() {
      const yearGrid = document.getElementById('year-grid');
      if (!yearGrid) return;
      yearGrid.innerHTML = '';
      const year = currentDate.getFullYear();
      const yearLabel = document.getElementById('current-year-label');
      if (yearLabel) yearLabel.innerText = year;

      const allDates = Object.keys(Storage.data.periods || {}).sort();

      for (let m = 0; m < 12; m++) {
        const monthBox = document.createElement('div');
        monthBox.className = 'p-3 rounded-xl bg-zinc-100/60 dark:bg-zinc-900/40 border border-zinc-200/80 dark:border-zinc-800 text-center flex flex-col justify-between min-h-[90px] cursor-pointer hover:border-rose-400 dark:hover:border-rose-500/50 transition-colors';
        
        const mName = monthNames[m].substring(0, 3);
        
        const monthStarts = allDates.filter(d => {
          const dt = new Date(d + 'T00:00:00');
          return dt.getFullYear() === year && dt.getMonth() === m;
        });

        let mainText = "—";
        let subText = "No log";

        if (monthStarts.length > 0) {
          const firstStartStr = monthStarts[0];
          const firstStartDt = new Date(firstStartStr + 'T00:00:00');
          const dayNum = firstStartDt.getDate();

          subText = `Started ${dayNum}${getDaySuffix(dayNum)}`;

          const prevIndex = allDates.indexOf(firstStartStr) - 1;
          if (prevIndex >= 0) {
            const prevDt = new Date(allDates[prevIndex] + 'T00:00:00');
            const diffTime = Math.abs(firstStartDt - prevDt);
            const cycleDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            mainText = `${cycleDays}d`;
          } else {
            mainText = "Log";
          }
        }

        monthBox.innerHTML = `
          <div class="text-[11px] font-mono uppercase text-zinc-400 tracking-wider">${mName}</div>
          <div class="text-xl font-light ${monthStarts.length > 0 ? 'text-rose-500 font-semibold' : 'text-zinc-300 dark:text-zinc-700'} my-1">${mainText}</div>
          <div class="text-[10px] text-zinc-500 dark:text-zinc-400 truncate">${subText}</div>
        `;
        
        monthBox.addEventListener('click', () => {
          currentDate.setMonth(m);
          document.getElementById('view-toggle').click();
        });

        yearGrid.appendChild(monthBox);
      }
    }

    function getDaySuffix(d) {
      if (d > 3 && d < 21) return 'th';
      switch (d % 10) {
        case 1:  return "st";
        case 2:  return "nd";
        case 3:  return "rd";
        default: return "th";
      }
    }

    // Initial render call
    renderMonth();
  </script>
</body>
</html>
